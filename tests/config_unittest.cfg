ID = "snapshot_invalid_fractional";
target_body = "Earth";
annual_modulation = true;
obs_day = 3;
obs_month = 8;
obs_year = 2026;
obs_hour = 12;
obs_minute = 0;
output_dir = "Output";

run_mode = "Parameter point"; // "Parameter point", "Parameter scan", or "Capture"
capture_mode = false;
sample_size = 1000;
fixed_seed = 0;               // 0 = nondeterministic; nonzero = reproducible MPI run
interpolation_points = 10;  // 0 disables interpolation

// Parameter-point options
isoreflection_rings = 1;

// Parameter-scan options (ignored for a parameter-point run)
compute_halo_constraints = true;
perform_full_scan = false;
constraints_certainty = 0.95;
constraints_mass_min = 2.0e-6; // GeV
constraints_mass_max = 1.0e-3; // GeV
constraints_masses = 5;
cross_section_min = 1.0e-37;   // cm^2
cross_section_max = 1.0e-32;   // cm^2
cross_sections = 5;

// Trajectory safety limits
max_trajectories = 0;                    // 0 = no limit
maximum_number_of_scatterings = 10000000000L;
max_trajectory_wall_time_sec = 0.0;      // seconds; 0 = no limit

// Periodic progress snapshots
snapshot_enabled = true;
snapshot_interval = 1000.0;              // wall-clock seconds

// Dark-matter particle (usually edit DM_mass and DM_cross_section_nucleon)
DM_mass = 0.1;                           // GeV
DM_spin = 0.5;
DM_fraction = 1.0;
DM_light = true;
DM_interaction = "SD";                   // "SI", "SD", or "DP"
DM_isospin_conserved = false;
DM_relative_couplings = (1.0, 0.0);       // proton, neutron
DM_cross_section_nucleon = 1.0e-35;       // cm^2
DM_cross_section_electron = 1.0e-80;      // cm^2
DM_form_factor = "Contact";
DM_mediator_mass = 0.0;                   // MeV

// Detection settings retained for compatibility with shared configuration code
DD_experiment = "SENSEI@MINOS";
DD_exposure = 300.0;                      // kg years
DD_efficiency = 1.0;
DD_observed_events = 0;
DD_expected_background = 0.0;
DD_targets_nuclear = (
    (4.0, 8),
    (1.0, 20),
    (1.0, 74)
);
DD_threshold_nuclear = 0.1;               // keV
DD_Emax_nuclear = 40.0;                   // keV
DD_energy_resolution = 0.0;               // keV
DD_target_electron = "Xe";
DD_threshold_electron = 4;

// Standard Halo Model
DM_distribution = "SHM";
DM_local_density = 0.4;                   // GeV / cm^3
SHM_v0 = 220.0;                           // km/s
SHM_vObserver = (11.1, 232.2, 7.3);       // km/s
SHM_vEscape = 544.0;                      // km/s

